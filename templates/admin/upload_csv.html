{% extends "admin/base_site.html" %}

{% block content %}
<h1>Suba un archivo CSV para añadir usuarios al sitio, usando los siguientes encabezados:</h1>
<h2>nombre, apellido, edad, cedula, categoria</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="button">Upload</button>
</form>
{% endblock %}
